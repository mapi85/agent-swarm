# Stack v2 — indépendante de la prod v1 : lancer avec
#   docker compose -f docker-compose.v2.yml -p agent-swarm-v2 up -d --build
# (projet, volumes et port distincts : la v1 sur :8000 n'est pas touchée)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: swarm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarm -d swarm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.v2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://swarm:${POSTGRES_PASSWORD}@db:5432/swarm
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - swarm-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 4g
    pids_limit: 512
    restart: unless-stopped

volumes:
  pgdata:
  swarm-data:
